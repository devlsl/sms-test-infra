services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "${STORAGE_PORT}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 3s
      timeout: 2s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: ../docker/server.Dockerfile
    env_file:
      - ./.env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: ./docker/client.Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - ./.env
    depends_on:
      - server
